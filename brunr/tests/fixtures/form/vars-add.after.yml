info:
  name: Bare Ping
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/health"

runtime:
  variables:
    - name: a
      value: "1"
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.id
        method: jsonq
      variable:
        name: id
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
