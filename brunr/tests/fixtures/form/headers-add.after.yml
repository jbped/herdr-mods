info:
  name: Bare Ping
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/health"
  headers:
    - name: accept
      value: application/json
    - name: x-n
      value: "1: 2"
      disabled: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
